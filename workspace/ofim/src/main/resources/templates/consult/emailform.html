<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>1:1 문의하기 | OFIM</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
body {
    font-family: 'Noto Sans KR', sans-serif;
    background-color: #f8f9fa;
}
.card {
    border: none;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
}
.page-header {
    border-bottom: 3px solid #0d6efd;
    padding-bottom: 15px;
}
.info-box {
    background: #f8f9fa;
    border-radius: 12px;
    border: 1px solid #e9ecef;
}
</style>
</head>
<body>

<div th:replace="~{header :: header}"></div>

<div class="container mt-5">
    <div class="text-center mb-5">
        <h2 class="fw-bold display-6">
            <i class="bi bi-chat-dots text-primary me-2"></i> 1:1 문의하기
        </h2>
        <p class="text-muted fs-5">
            전문가에게 궁금한 사항을 남겨주시면 답변을 받을 수 있습니다.
        </p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-9">
            <form th:action="@{/consult/emailform/submit}" method="post" id="consultForm" enctype="multipart/form-data">

    <input type="hidden" name="expertId" th:value="${expert.expertId}">
<input type="hidden" name="consultType" th:value="${type}">

    <div class="card p-4 mb-4">

        <div class="page-header mb-4">
            <h5 class="fw-bold mb-0">문의 내용 작성</h5>
        </div>

        <div class="info-box p-3 mb-4">
            <div class="mb-1">
                <span class="text-muted">문의 대상 전문가</span> :
                <span class="fw-bold" th:text="${expert.name}">홍길동 전문가</span>
            </div>
            <div>
                <span class="text-muted">상담 방식</span> :
                <span th:text="${type}">문의</span>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold">문의 제목</label>
            <input type="text"
                   name="title"
                   class="form-control form-control-lg"
                   placeholder="문의 제목을 입력해주세요."
                   th:value="${presetTitle}"
                   required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold">상세 내용</label>
            <textarea name="content"
                      class="form-control"
                      rows="10"
                      placeholder="문의 내용을 구체적으로 작성해주세요."
                      required></textarea>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold">
                <i class="bi bi-paperclip me-1"></i>파일 첨부 (선택)
            </label>
            <input type="file" name="files" class="form-control" multiple>
            <div class="form-text">
                이미지, PDF 파일 첨부 가능 (최대 10MB)
            </div>
        </div>

        <hr class="my-4">

        <div class="bg-light p-3 rounded-3 mb-4 small text-secondary">
            <p class="mb-1"><i class="bi bi-info-circle me-1"></i> 문의 등록 후 전문가 답변은 상담 히스토리에서 확인 가능합니다.</p>
            <p class="mb-1"><i class="bi bi-info-circle me-1"></i> 1:1 문의는 예약 시간 없이 질문을 남기는 방식입니다.</p>
            <p class="mb-0"><i class="bi bi-info-circle me-1"></i> 증상, 목표, 궁금한 점을 자세히 작성해주시면 더 정확한 답변을 받을 수 있습니다.</p>
        </div>

        <div class="row g-2">
            <div class="col-6">
                <button type="button"
                        class="btn btn-outline-secondary w-100 py-3 fw-bold"
                        onclick="history.back();">
                    취소
                </button>
            </div>
            <div class="col-6">
                <button type="submit"
                        class="btn btn-primary w-100 py-3 fw-bold fs-5 shadow-sm">
                    문의 등록하기
                </button>
            </div>
        </div>

    </div>
</form>
        </div>
    </div>
</div>

<footer th:replace="~{footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelector('#consultForm').addEventListener('submit', function(e) {
    const notice = "1:1 문의를 등록하시겠습니까?\n문의 내용과 답변 상태는 마이페이지에서 확인하실 수 있습니다";
    if (!confirm(notice)) {
        e.preventDefault();
    }
});
</script>

</body>
</html>
