<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 비밀번호 설정 | 오핌</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .reset-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* 🌟 비밀번호 재설정 페이지 커스텀 스타일 */
		.reset-pw-container {
		    max-width: 450px;
		    width: 100%;
		    margin: 60px auto;
		    padding: 40px 35px;
		    background: #ffffff;
		    border-radius: 24px;
		    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08); /* 부드러운 그림자 */
		}
		
		/* 상단 아이콘 디자인 */
		.reset-pw-icon {
		    width: 70px;
		    height: 70px;
		    background-color: #eff6ff;
		    color: #3b82f6;
		    border-radius: 50%;
		    display: inline-flex;
		    align-items: center;
		    justify-content: center;
		    margin-bottom: 20px;
		}
		
		/* 🌟 입력창 아이콘 그룹 스타일 */
		.reset-pw-container .input-group-text {
		    background-color: #fff;
		    border: 2px solid #e2e8f0;
		    border-right: none;
		    border-radius: 12px 0 0 12px;
		    color: #94a3b8;
		    padding-left: 18px;
		}
		
		.reset-pw-container .form-control {
		    border: 2px solid #e2e8f0;
		    border-left: none;
		    border-radius: 0 12px 12px 0;
		    padding: 14px 18px 14px 10px;
		    font-size: 14.5px;
		    color: #334155;
		    transition: all 0.3s;
		}
		
		.reset-pw-container .form-control:focus {
		    border-color: #93c5fd;
		    box-shadow: none;
		}
		
		.reset-pw-container .form-control:focus + .input-group-text {
		    border-color: #93c5fd;
		}
		
		/* 🌟 2줄로 잘리는 현상 해결 (자간 축소 & 단어 단위 줄바꿈 방지) */
		.condition-text {
		    font-size: 0.8rem;
		    letter-spacing: -0.5px; 
		    word-break: keep-all; 
		    padding-left: 5px;
		}
		
		/* 세련된 버튼 디자인 */
		.btn-gradient {
		    background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
		    border: none;
		    border-radius: 14px;
		    padding: 15px;
		    font-size: 16px;
		    font-weight: 700;
		    transition: all 0.3s ease;
		    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
		}
		
		.btn-gradient:hover {
		    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
		    transform: translateY(-2px);
		    box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
		}
    </style>
</head>
<body>

<div style="background-color: #f8fafc; min-height: 100vh; padding-top: 50px;">
    
    <div class="reset-pw-container">
        <div class="text-center mb-4">
            <div class="reset-pw-icon">
                <i class="fa-solid fa-lock fa-2xl"></i>
            </div>
            <h3 class="fw-bold text-dark">새 비밀번호 설정</h3>
            <p class="text-muted mt-2" style="font-size: 0.95rem; letter-spacing: -0.5px;">
                새롭게 사용할 비밀번호를 입력해 주세요.
            </p>
        </div>

        <form id="resetPasswordForm" action="/auth/reset-password" method="post">
            <input type="hidden" name="email" th:value="${email}">

            <div class="mb-4">
                <label class="form-label fw-bold text-secondary" style="font-size: 0.9rem;">새 비밀번호</label>
                
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                    <input type="password" id="password" name="newPassword" class="form-control" placeholder="새 비밀번호 입력" required>
                </div>
                
                <div id="pwConditionMsg" class="mt-2 text-muted condition-text">
                    영문, 숫자, 특수문자를 포함하여 8~20자로 입력해주세요.
                </div>
            </div>

            <div class="mb-5">
                <label class="form-label fw-bold text-secondary" style="font-size: 0.9rem;">새 비밀번호 확인</label>
                
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-check-double"></i></span>
                    <input type="password" id="passwordCheck" class="form-control" placeholder="비밀번호를 다시 입력해주세요" required>
                </div>
                
                <div id="passwordFeedback" class="mt-2 fw-medium condition-text"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-gradient">
                비밀번호 재설정 <i class="fa-solid fa-arrow-right ms-2"></i>
            </button>
        </form>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const pw = document.getElementById("password");
    const pwCheck = document.getElementById("passwordCheck");
    const pwConditionMsg = document.getElementById("pwConditionMsg");
    const pwFeedback = document.getElementById("passwordFeedback"); 
    const pwRegex = /^(?=.*[a-zA-Z])(?=.*[0-9])(?=.*[!@#$%^&*?_]).{8,20}$/;

    if (pw && pwCheck) {
        const validatePasswordMatch = () => {
            const p1 = pw.value; const p2 = pwCheck.value;
            if (p2 === "") { pwFeedback.textContent = ""; pwCheck.classList.remove('is-valid', 'is-invalid'); return; }
            if (p1 === p2) { 
                pwFeedback.textContent = "✓ 비밀번호가 일치합니다."; pwFeedback.style.color = "#0fb8ad"; 
                pwCheck.classList.remove('is-invalid'); pwCheck.classList.add('is-valid');
            } else { 
                pwFeedback.textContent = "✕ 비밀번호가 일치하지 않습니다."; pwFeedback.style.color = "#e53e3e"; 
                pwCheck.classList.remove('is-valid'); pwCheck.classList.add('is-invalid');
            }
        };

        pw.addEventListener("input", function(e) {
            const val = e.target.value;
            if (val.length === 0) {
                pwConditionMsg.className = "mt-2 text-muted";
                pwConditionMsg.textContent = "영문, 숫자, 특수문자를 포함하여 8~20자로 입력해주세요.";
                pw.classList.remove('is-valid', 'is-invalid');
            } else if (pwRegex.test(val)) {
                pwConditionMsg.className = "mt-2 text-success";
                pwConditionMsg.innerHTML = '<i class="fas fa-check"></i> 완벽한 비밀번호입니다!';
                pw.classList.remove('is-invalid'); pw.classList.add('is-valid');
            } else {
                pwConditionMsg.className = "mt-2 text-danger";
                pwConditionMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> 영문, 숫자, 특수문자를 모두 포함해주세요.';
                pw.classList.remove('is-valid'); pw.classList.add('is-invalid');
            }
            validatePasswordMatch();
        });

        pwCheck.addEventListener("input", validatePasswordMatch);
    }

    // 🌟 전송 전 마지막 방어!
    document.getElementById("resetPasswordForm").addEventListener("submit", function(e) {
        const pwVal = pw.value;
        if (!pwRegex.test(pwVal)) {
            alert("비밀번호 조건을 다시 확인해주세요.");
            pw.focus();
            e.preventDefault(); // 전송 막기
            return;
        }
        if (pwVal !== pwCheck.value) {
            alert("비밀번호가 일치하지 않습니다."); 
            pwCheck.focus(); 
            e.preventDefault(); // 전송 막기
            return;
        }
    });
});
</script>

</body>
</html>
