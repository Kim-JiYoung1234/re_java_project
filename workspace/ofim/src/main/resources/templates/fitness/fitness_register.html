<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시설 등록 | OUT FAT IN MUSCLE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; scroll-behavior: smooth; }
        .hero-banner-upload { width: 100%; height: 400px; background-color: #212529; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; transition: 0.3s; cursor: pointer; }
        .hero-banner-upload:hover { background-color: #343a40; }
        #img-preview { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7); }
        .info-card { margin-top: -80px; position: relative; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 40px; border: none; z-index: 10; }
        .icon-box { width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #f8f9fa; color: #4f46e5; font-size: 1.2rem; }
        .form-control-custom { border: 1px dashed #ced4da; border-radius: 8px; padding: 10px 15px; width: 100%; transition: 0.2s; background-color: #f8f9fa; color: #212529; font-weight: 500; }
        .form-control-custom:focus { border: 1px solid #4f46e5; outline: none; background-color: #fff; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .title-input { font-size: 2.2rem; font-weight: 800; border: none; border-bottom: 2px dashed #ced4da; background: transparent; padding: 5px 0; width: 100%; color: #111827; letter-spacing: -1px; }
        .title-input:focus { border-bottom: 2px solid #4f46e5; outline: none; }
        .addr-input { border: none; border-bottom: 1px dashed #ced4da; background: transparent; padding: 5px 0; width: 100%; font-size: 1.1rem; color: #4b5563; font-weight: 500; transition: 0.2s;}
        .addr-input:focus { border-bottom: 1px solid #4f46e5; color: #111827; outline: none; }
    </style>
</head>
<body>
    <header th:replace="~{header :: header}"></header>

    <form th:action="@{/fitness/register}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="lat" id="lat" value="37.5665">
        <input type="hidden" name="lon" id="lon" value="126.9780">

        <div class="hero-banner-upload shadow-sm">
            <input type="file" name="imageFile" id="imageFile" accept="image/*" class="position-absolute w-100 h-100 opacity-0" style="cursor:pointer; z-index: 10;" onchange="previewImg(this)">
            <div id="upload-placeholder" class="text-center text-white" style="z-index: 5;">
                <i class="bi bi-camera-fill mb-2" style="font-size: 4rem;"></i>
                <h3 class="fw-bold">시설 대표 사진 업로드</h3>
            </div>
            <img id="img-preview" class="position-absolute w-100 h-100 d-none" style="z-index: 4;">
        </div>

        <div class="container mb-5">
            <div class="card info-card">
                
                <div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
                    <select name="type" class="form-select bg-dark text-white fw-bold rounded-pill px-3" style="width: auto; border:none; cursor:pointer;" required>
                        <option value="">업종 선택 ▾</option>
                        <option value="헬스장">헬스장</option>
                        <option value="필라테스">필라테스</option>
                        <option value="요가">요가</option>
                        <option value="크로스핏">크로스핏</option>
                        <option value="무도학원">무도학원</option>
                    </select>
                    <select name="dayPassYn" class="form-select bg-success bg-opacity-10 text-success fw-bold" style="border: 1px solid #a3e6cd; border-radius: 12px; width: auto; cursor:pointer;" required>
                        <option value="">일일권 설정 ▾</option>
                        <option value="1">일일권 이용 가능 센터</option>
                        <option value="0">일일권 불가 (회원전용)</option>
                    </select>
                </div>

                <div class="mb-4">
                    <input type="text" name="centerName" class="title-input mb-3" placeholder="피트니스 센터 이름 입력" required>
                    <div class="d-flex align-items-start gap-2">
                        <i class="bi bi-geo-alt-fill text-danger mt-2 fs-5"></i>
                        <div class="w-100">
                            <input type="text" id="facilityAddr" name="facilityAddr" class="addr-input fw-bold text-dark" placeholder="클릭하여 도로명/지번 주소 검색" readonly required onclick="execDaumPostcode()" style="cursor: pointer;">
                            <input type="text" id="facilityAddrDetail" name="facilityAddrDetail" class="addr-input mt-1" placeholder="상세 주소 (건물명, 층, 호수)">
                        </div>
                    </div>
                </div>

                <hr class="text-muted opacity-25 mb-4">

                <div class="row g-4 mb-4">
                    <div class="col-md-6 col-lg-3">
                        <div class="d-flex align-items-center gap-3">
                            <div class="icon-box"><i class="bi bi-telephone-fill"></i></div>
                            <div class="w-100">
                                <small class="text-muted d-block fw-bold mb-1">전화번호 <span class="text-danger">*</span></small>
                                <input type="text" name="centerPhone" class="form-control form-control-sm form-control-custom" placeholder="02-123-4567" required>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <div class="d-flex align-items-center gap-3">
                            <div class="icon-box"><i class="bi bi-clock-fill"></i></div>
                            <div class="w-100">
                                <small class="text-muted d-block fw-bold mb-1">운영시간 <span class="text-danger">*</span></small>
                                <button type="button" class="btn btn-outline-dark btn-sm w-100 fw-bold" data-bs-toggle="modal" data-bs-target="#workingHoursModal">상세 시간 설정 <i class="bi bi-gear-fill ms-1"></i></button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 목록 노출용 대표 요금 유지 -->
                    <div class="col-md-6 col-lg-3">
                        <div class="d-flex align-items-center gap-3">
                            <div class="icon-box"><i class="bi bi-cash-coin"></i></div>
                            <div class="w-100">
                                <small class="text-muted d-block fw-bold mb-1">대표 월회비 (리스트용) <span class="text-danger">*</span></small>
                                <div class="input-group input-group-sm">
                                    <input type="number" name="monthCost" class="form-control form-control-custom text-end" placeholder="가장 저렴한 요금" required>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <div class="d-flex align-items-center gap-3">
                            <div class="icon-box"><i class="bi bi-ticket-perforated"></i></div>
                            <div class="w-100">
                                <small class="text-muted d-block fw-bold mb-1">대표 일일권</small>
                                <div class="input-group input-group-sm">
                                    <input type="number" name="dayCost" class="form-control form-control-custom text-end" placeholder="일일권 요금">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 🌟 [결제 시스템 1단계] 판매용 다중 회원권 동적 UI -->
                <div class="bg-primary bg-opacity-10 rounded-4 p-4 mb-4 border border-primary border-opacity-25">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0 text-primary"><i class="bi bi-tags-fill me-2"></i>앱에서 판매할 상품(회원권) 등록</h5>
                        <button type="button" class="btn btn-primary btn-sm fw-bold rounded-pill" onclick="addTicketRow()"><i class="bi bi-plus-lg me-1"></i>상품 추가</button>
                    </div>
                    <p class="small text-muted mb-3">유저들이 장바구니에 담고 실제 결제하게 될 상세 회원권들입니다. 가격 할인을 적용하면 유저들에게 더욱 돋보이게 노출됩니다.</p>
                    
                    <div class="row g-2 fw-bold text-center text-muted small mb-2 d-none d-md-flex">
                        <div class="col-md-4">상품명 (예: 헬스 3개월권)</div>
                        <div class="col-md-2">이용 기간</div>
                        <div class="col-md-2">현장 정상가</div>
                        <div class="col-md-3">앱 전용 할인가</div>
                        <div class="col-md-1">삭제</div>
                    </div>
                    
                    <div id="ticket-container">
                        <!-- 동적으로 입력창이 붙는 영역 -->
                        <div class="row g-2 align-items-center mb-2 ticket-row">
                            <div class="col-md-4"><input type="text" name="ticketNames" class="form-control bg-white" placeholder="예: 헬스 1개월권" required></div>
                            <div class="col-md-2">
                                <div class="input-group"><input type="number" name="periodMonths" class="form-control bg-white" placeholder="1" required><span class="input-group-text bg-white">개월</span></div>
                            </div>
                            <div class="col-md-2"><input type="number" name="ticketPrices" class="form-control bg-white text-end" placeholder="정상가" required></div>
                            <div class="col-md-3"><input type="number" name="discountPrices" class="form-control bg-white text-end text-primary fw-bold" placeholder="할인가 (앱 결제가)" required></div>
                            <div class="col-md-1"><button type="button" class="btn btn-outline-danger w-100" onclick="removeTicketRow(this)" disabled><i class="bi bi-trash"></i></button></div>
                        </div>
                    </div>
                </div>

                <div class="bg-light rounded-4 p-4 mb-4">
                    <h5 class="fw-bold mb-3"><i class="bi bi-chat-quote-fill text-primary me-2"></i>사장님 한마디 <span class="text-danger">*</span></h5>
                    <textarea name="description" class="form-control form-control-custom" rows="4" placeholder="시설의 장점, 넓고 쾌적한 환경, 진행 중인 이벤트 등 소개글을 적어주세요." required></textarea>
                </div>

                <div class="row g-4">
                    <div class="col-md-6">
                        <h5 class="fw-bold mb-3"><i class="bi bi-check-circle-fill text-success me-2"></i>편의 시설 <span class="text-danger">*</span></h5>
                        <input type="text" name="facilityAmenities" class="form-control form-control-custom" placeholder="예: 주차가능, 샤워실, 수건제공 (쉼표로 구분)" required>
                    </div>
                    <div class="col-md-6">
                        <h5 class="fw-bold mb-3"><i class="bi bi-plus-circle-fill text-info me-2"></i>부가 서비스</h5>
                        <input type="text" name="addon" class="form-control form-control-custom" placeholder="예: 개인 락커 무료 제공, 체형 분석기 보유">
                    </div>
                </div>
                
                <hr class="my-5">
                <h4 class="fw-bold mb-4"><i class="bi bi-link-45deg text-secondary me-2"></i>온라인 채널 연결</h4>
                <div class="row g-4 mb-5">
                    <div class="col-md-4"><label class="fw-bold small mb-2 text-muted">공식 홈페이지</label><input type="url" name="homepageUrl" class="form-control form-control-custom"></div>
                    <div class="col-md-4"><label class="fw-bold small mb-2 text-muted">인스타그램</label><input type="url" name="snsLink1" class="form-control form-control-custom"></div>
                    <div class="col-md-4"><label class="fw-bold small mb-2 text-muted">네이버 블로그</label><input type="url" name="snsLink2" class="form-control form-control-custom"></div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-dark btn-lg px-5 py-3 rounded-pill fw-bold fs-5 shadow submit-btn">
                        <i class="bi bi-send-check-fill me-2"></i> 시설 등록 승인 요청하기
                    </button>
                </div>
            </div>
        </div>

        <!-- 운영시간 설정 모달 -->
        <div class="modal fade" id="workingHoursModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content" style="border-radius: 20px; border: none;">
                    <div class="modal-header bg-light" style="border-radius: 20px 20px 0 0;">
                        <h5 class="modal-title fw-bold"><i class="bi bi-clock-history me-2 text-primary"></i>운영시간 상세 설정</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4 p-md-5">
                        <div class="form-check form-switch mb-4 pb-3 border-bottom d-flex align-items-center gap-2">
                            <input class="form-check-input fs-3 m-0" type="checkbox" id="is24h" name="is24h" value="true">
                            <label class="form-check-label fw-bold text-danger mt-1 ms-2" for="is24h">24시간 연중무휴 매장입니다.</label>
                        </div>
                        <div class="row g-4" id="timeInputsWrapper">
                            <div class="col-md-6"><label class="form-label fw-bold text-dark">평일 (월~금)</label><div class="d-flex align-items-center gap-2"><input type="time" name="weekdayOpen" class="form-control bg-light"> ~ <input type="time" name="weekdayClose" class="form-control bg-light"></div></div>
                            <div class="col-md-6"><label class="form-label fw-bold text-primary">토요일</label><div class="d-flex align-items-center gap-2"><input type="time" name="satOpen" class="form-control bg-light"> ~ <input type="time" name="satClose" class="form-control bg-light"></div></div>
                            <div class="col-md-6"><label class="form-label fw-bold text-danger">일/공휴일</label><div class="d-flex align-items-center gap-2"><input type="time" name="sunOpen" class="form-control bg-light"> ~ <input type="time" name="sunClose" class="form-control bg-light"></div></div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light" style="border-radius: 0 0 20px 20px;">
                        <button type="button" class="btn btn-dark px-4 fw-bold rounded-pill" data-bs-dismiss="modal">저장 후 닫기</button>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <footer th:replace="~{footer :: footer}"></footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=2e8f4bf950438018ae183b2467c7e5f5&libraries=services"></script>

    <script>
        // 상품 추가 UI 로직
        function addTicketRow() {
            const rowHtml = `
                <div class="row g-2 align-items-center mb-2 ticket-row">
                    <div class="col-md-4"><input type="text" name="ticketNames" class="form-control bg-white" placeholder="예: 헬스 3개월권" required></div>
                    <div class="col-md-2"><div class="input-group"><input type="number" name="periodMonths" class="form-control bg-white" placeholder="3" required><span class="input-group-text bg-white">개월</span></div></div>
                    <div class="col-md-2"><input type="number" name="ticketPrices" class="form-control bg-white text-end" placeholder="정상가" required></div>
                    <div class="col-md-3"><input type="number" name="discountPrices" class="form-control bg-white text-end text-primary fw-bold" placeholder="할인가 (앱 결제가)" required></div>
                    <div class="col-md-1"><button type="button" class="btn btn-outline-danger w-100" onclick="removeTicketRow(this)"><i class="bi bi-trash"></i></button></div>
                </div>
            `;
            $('#ticket-container').append(rowHtml);
            updateRemoveButtons();
        }

        function removeTicketRow(btn) {
            $(btn).closest('.ticket-row').remove();
            updateRemoveButtons();
        }

        function updateRemoveButtons() {
            const rows = $('.ticket-row');
            if(rows.length <= 1) { rows.find('.btn-outline-danger').prop('disabled', true); }
            else { rows.find('.btn-outline-danger').prop('disabled', false); }
        }

        // 🌟 [버그 수정] 24시간 제어 (disabled 속성을 버리고 readOnly와 style 제어로 변경)
        document.getElementById('is24h').addEventListener('change', function() {
            const timeInputs = document.querySelectorAll('#timeInputsWrapper input[type="time"]');
            timeInputs.forEach(input => { 
                input.readOnly = this.checked; 
                if(this.checked) {
                    input.value = '00:00'; 
                    input.style.pointerEvents = 'none';
                    input.style.backgroundColor = '#e9ecef';
                } else {
                    input.value = '';
                    input.style.pointerEvents = 'auto';
                    input.style.backgroundColor = '';
                }
            });
        });

        // 주소 검색 및 좌표 변환
        function execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    var addr = data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress;
                    document.getElementById('facilityAddr').value = addr;
                    var geocoder = new kakao.maps.services.Geocoder();
                    geocoder.addressSearch(addr, function(result, status) {
                        if (status === kakao.maps.services.Status.OK) {
                            document.getElementById('lat').value = result[0].y;
                            document.getElementById('lon').value = result[0].x;
                        }
                    });
                }
            }).open();
        }

        // 사진 미리보기
        function previewImg(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('img-preview').src = e.target.result;
                    document.getElementById('img-preview').classList.remove('d-none');
                    document.getElementById('upload-placeholder').classList.add('d-none');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
