<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>커뮤니티 게시글 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header th:replace="~{header :: header}"></header>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>📢 커뮤니티 게시글</h3>
            <a th:href="@{/community/write}" class="btn btn-primary">글쓰기</a>
        </div>

        <table class="table table-hover shadow-sm">
            <thead class="table-light">
                <tr>
                    <th style="width: 8%;">번호</th>
                    <th style="width: 12%;">카테고리</th>
                    <th style="width: 40%;">제목</th>
                    <th style="width: 20%;">작성자</th> 
                    <th style="width: 20%;">작성일</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="board : ${boardList}">
                    <td th:text="${board.postId}">1</td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${board.categoryName}">일상</span>
                    </td>
                    <td>
                        <a th:href="@{|/community/detail/${board.postId}|}" 
                           th:text="${board.title}" class="text-decoration-none text-dark fw-bold">제목</a>
                    </td>
                    <td th:text="${board.writerName}"></td>
                    <td th:text="${#dates.format(board.createdDate, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
                </tr>
                <tr th:if="${#lists.isEmpty(boardList)}">
                    <td colspan="5" class="text-center py-5 text-muted">등록된 게시글이 없습니다.</td>
                </tr>
            </tbody>
        </table>

      
    </main>

    <footer th:replace="~{footer :: footer}"></footer>
</body>
</html>
