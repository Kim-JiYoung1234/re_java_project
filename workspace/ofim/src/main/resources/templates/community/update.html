<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>게시글 수정</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>
	<header th:replace="~{header :: header}"></header>
	<main class="container my-5" style="max-width: 800px;">
		<h3>게시글 수정</h3>
		<form th:action="@{/community/update}" method="post">
			<input type="hidden" name="postId" th:value="${board.postId}">

			<input type="hidden" name="categoryId" th:value="${board.categoryId}">

			<div class="mb-3">
				<label class="form-label">제목</label> <input type="text" name="title"
					class="form-control" th:value="${board.title}" required>
			</div>

			<div class="mb-3">
				<label class="form-label">내용</label>
				<textarea name="content" class="form-control" rows="10" required>[[${board.content}]]</textarea>
			</div>

			<div class="text-end">
				<button type="button" class="btn btn-secondary"
					onclick="history.back()">취소</button>
				<button type="submit" class="btn btn-warning">수정완료</button>
			</div>
		</form>
	</main>
</body>
</html>
