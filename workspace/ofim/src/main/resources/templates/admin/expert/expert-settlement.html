<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">

    <style>
        .settlement-card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            background: #fff;
        }

        .settlement-kpi {
            border: none;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            background: #fff;
            height: 100%;
        }

        .settlement-kpi .label {
            font-size: .9rem;
            color: #6b7280;
            font-weight: 600;
        }

        .settlement-kpi .value {
            font-size: 1.7rem;
            font-weight: 800;
            color: #111827;
            line-height: 1.2;
        }

        .settlement-kpi .sub {
            font-size: .82rem;
            color: #9ca3af;
        }

        .filter-label {
            font-size: .92rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: 6px;
        }

        .table thead th {
            white-space: nowrap;
        }

        .table tbody td {
            white-space: nowrap;
        }

        .amount-text {
            font-weight: 700;
            color: #111827;
        }

        .badge-wait {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-done {
            background: #dcfce7;
            color: #166534;
        }

        .empty-box {
            border: 1px dashed #d1d5db;
            border-radius: 18px;
            background: #fafafa;
            padding: 48px 20px;
            text-align: center;
            color: #6b7280;
        }
    </style>

    <!-- 상단 KPI -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="settlement-kpi p-4">
                <div class="label">정산 대상 전문가 수</div>
                <div class="value" th:text="${summary != null ? summary.expertCount : 0}">0</div>
                <div class="sub">조회 조건 기준</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="settlement-kpi p-4">
                <div class="label">총 상담건수</div>
                <div class="value" th:text="${summary != null ? summary.consultCount : 0}">0</div>
                <div class="sub">완료 상담 기준</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="settlement-kpi p-4">
                <div class="label">총 정산금액</div>
                <div class="value"
                     th:text="${summary != null ? #numbers.formatInteger(summary.totalSettlementAmount, 3, 'COMMA') : 0} + '원'">
                    0원
                </div>
                <div class="sub">조회 조건 기준</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="settlement-kpi p-4">
                <div class="label">정산 완료 건수</div>
                <div class="value" th:text="${summary != null ? summary.completedCount : 0}">0</div>
                <div class="sub">상태 완료 기준</div>
            </div>
        </div>
    </div>

    <!-- 검색 필터 -->
    <div class="settlement-card p-4 mb-4">
        <form th:action="@{/admin/expert-settlements}" method="get">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="filter-label">정산월</label>
                    <input type="month"
                           name="settlementMonth"
                           class="form-control"
                           th:value="${settlementMonth}">
                </div>

                <div class="col-md-4">
                    <label class="filter-label">전문가 검색</label>
                    <input type="text"
                           name="keyword"
                           class="form-control"
                           placeholder="전문가ID 또는 이름 검색"
                           th:value="${keyword}">
                </div>

                <div class="col-md-2">
                    <label class="filter-label">상태</label>
                    <select name="status" class="form-select">
                        <option value="">전체</option>
                        <option value="대기" th:selected="${status == '대기'}">대기</option>
                        <option value="완료" th:selected="${status == '완료'}">완료</option>
                    </select>
                </div>

                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-search me-1"></i> 조회
                    </button>
                    <a th:href="@{/admin/expert-settlements}"
                       class="btn btn-light border rounded-pill px-4">
                        초기화
                    </a>
                </div>
            </div>
        </form>
    </div>

    <!-- 목록 테이블 -->
    <div class="settlement-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="fw-bold mb-1">전문가 정산 목록</h4>
                <div class="text-muted small">월별, 전문가별 정산 내역을 조회합니다.</div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(settlementList)}" class="empty-box">
            <i class="bi bi-receipt-cutoff fs-1 d-block mb-3"></i>
            조회된 정산 데이터가 없습니다.
        </div>

        <div th:unless="${#lists.isEmpty(settlementList)}" class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>정산월</th>
                        <th>전문가ID</th>
                        <th>이름</th>
                        <th>상담건수</th>
                        <th>정산금액</th>
                        <th>상태</th>
                        <th>정산일</th>
                        <th>상세</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${settlementList}">
                        <td th:text="${item.settlementMonth}">2026-03</td>
                        <td th:text="${item.expertId}">101</td>
                        <td th:text="${item.expertName}">홍길동</td>
                        <td th:text="${item.consCnt}">12</td>
                        <td class="amount-text"
                            th:text="${item.currAmt != null ? #numbers.formatDecimal(item.currAmt, 0, 'COMMA', 0, 'POINT') : '0'} + '원'">
                            0원
                        </td>
                        <td>
                            <span class="badge rounded-pill"
                                  th:classappend="${item.status == '완료'} ? ' badge-done' : ' badge-wait'"
                                  th:text="${item.status}">
                                대기
                            </span>
                        </td>
                        <td th:text="${item.settlementDate != null ? #temporals.format(item.settlementDate, 'yyyy-MM-dd') : '-'}">
                            -
                        </td>
                        <td>
                            <a th:href="@{/admin/expert-settlements/detail(expertId=${item.expertId}, settlementMonth=${item.settlementMonth})}"
                               class="btn btn-sm btn-outline-primary rounded-pill">
                                상세
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</html>
