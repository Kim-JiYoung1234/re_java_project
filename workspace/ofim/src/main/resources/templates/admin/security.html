<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{admin/layout :: layout(~{::#main-content})}">
    <div id="main-content" th:fragment="content">
        <style>
            /* 보내주신 고급 CSS 완벽 적용 (보안 테마에 맞춰 붉은색/어두운 톤 그라데이션으로 미세 조정) */
            .security-card-main { background: linear-gradient(135deg, #450a0a, #7f1d1d); color: white; border-radius: 20px; padding: 40px 30px; position: relative; overflow: hidden; height: 100%; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1);}
            .security-card-main::after { content: '\F530'; font-family: 'bootstrap-icons'; position: absolute; right: -20px; bottom: -30px; font-size: 12rem; color: rgba(255,255,255,0.05); }
            .stat-card { background: white; border-radius: 20px; border: none; padding: 30px; height: 100%; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 5px 20px rgba(0,0,0,0.03);}
            .stat-title { font-size: 0.95rem; font-weight: 700; color: #6c757d; text-transform: uppercase; margin-bottom: 10px;}
            .stat-value { font-size: 2.8rem; font-weight: 800; color: #111827; letter-spacing: -1px;}
        </style>

        <!-- 1. 페이지 타이틀 영역 -->
        <div class="mb-4">
            <h3 class="fw-bold mb-1 text-dark"><i class="bi bi-shield-lock-fill text-danger me-2"></i>보안 및 감사 로그 대시보드</h3>
            <p class="text-muted">시스템에 기록된 실시간 로그인 시도 및 공격 차단 현황입니다.</p>
        </div>

        <!-- 2. 상단 통계 카드 영역 (보내주신 레이아웃 비율 적용) -->
        <div class="row g-4 mb-4">
            <div class="col-lg-6">
                <div class="security-card-main">
                    <h6 class="text-light fw-bold mb-2 opacity-75" style="letter-spacing: 2px; z-index: 10;">TODAY BLOCKED ATTEMPTS</h6>
                    <h1 class="display-4 fw-bold text-white mb-0" style="z-index: 10; letter-spacing: -2px;">
                        <span th:text="${stats.blockCnt != null ? stats.blockCnt : '0'}">0</span> <span class="fs-4 fw-normal opacity-75">건 차단됨</span>
                    </h1>
                </div>
            </div>
            
            <div class="col-lg-3">
                <div class="stat-card border-bottom border-success border-4">
                    <div class="stat-title"><i class="bi bi-shield-check me-1"></i> 오늘 정상 로그인</div>
                    <div class="stat-value text-success">
                        <span th:text="${stats.successCnt != null ? stats.successCnt : '0'}">0</span><span class="fs-5 text-muted fw-normal ms-1">건</span>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-3">
                <div class="stat-card border-bottom border-warning border-4">
                    <div class="stat-title"><i class="bi bi-exclamation-triangle me-1"></i> 오늘 로그인 실패</div>
                    <div class="stat-value text-warning">
                        <span th:text="${stats.failCnt != null ? stats.failCnt : '0'}">0</span><span class="fs-5 text-muted fw-normal ms-1">건</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. 검색 및 액션 바 영역 -->
        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-4">
                <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
                    <div class="d-flex flex-wrap gap-2 align-items-center">
                        <input type="date" id="searchDate" class="form-control" style="width:180px;">
                        <select class="form-select" style="width:180px;">
                            <option selected>전체 상태</option>
                            <option value="SUCCESS">SUCCESS (성공)</option>
                            <option value="FAIL">FAIL (실패)</option>
                            <option value="BLOCKED">BLOCKED (차단)</option>
                        </select>
                        <button class="btn btn-primary px-4 fw-bold" type="button" onclick="location.reload();">
                            <i class="bi bi-search me-2"></i>조회
                        </button>
                        <button class="btn btn-light px-3 text-secondary fw-bold" type="button" onclick="location.href='/admin/security'">초기화</button>
                    </div>
                    <button class="btn btn-dark fw-bold px-4 rounded-pill shadow-sm" type="button">
                        <i class="bi bi-file-earmark-excel-fill me-2"></i>엑셀 다운로드
                    </button>
                </div>
            </div>
        </div>

        <!-- 4. 메인 데이터 테이블 영역 -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5">
            <div class="card-header bg-white p-4 border-bottom d-flex justify-content-between align-items-center">
                <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-list-columns-reverse me-2 text-secondary"></i>상세 감사 로그 (Audit Log)</h5>
                <span class="badge bg-success bg-opacity-10 text-success border border-success px-3 py-2 rounded-pill">
                    <i class="bi bi-circle-fill small me-1" style="font-size: 0.5rem;"></i> Live Data Connected
                </span>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="py-3">번호</th>
                            <th class="text-start ps-4 py-3">시도 ID</th>
                            <th class="py-3">IP 주소</th>
                            <th class="py-3">기기 / 브라우저</th>
                            <th class="py-3">상태</th>
                            <th class="py-3">상세 사유</th>
                            <th class="text-end pe-4 py-3">시각</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${auditLogs}">
                            <td class="text-muted fw-bold" th:text="'#' + ${log.auditNo}"></td>
                            <td class="text-start ps-4">
                                <div class="fw-bold text-dark fs-6" th:text="${log.loginId}"></div>
                            </td>
                            <td class="text-secondary fw-semibold" th:text="${log.ipAddress}"></td>
                            <td class="small text-truncate text-secondary" style="max-width:200px;" th:title="${log.userAgent}" th:text="${log.userAgent}"></td>
                            <td>
                                <!-- 상태별 배지 색상 (SUCCESS:파랑, FAIL:노랑, BLOCKED:빨강) -->
                                <span class="badge rounded-pill px-3 py-2" 
                                      th:classappend="${log.status == 'SUCCESS' ? 'bg-primary text-white' : (log.status == 'FAIL' ? 'bg-warning text-dark' : 'bg-danger text-white')}"
                                      th:text="${log.status}"></span>
                            </td>
                            <td class="fw-bold" th:classappend="${log.status == 'SUCCESS' ? 'text-primary' : 'text-danger'}" th:text="${log.failReason}"></td>
                            <td class="text-end pe-4 text-muted small fw-semibold" th:text="${log.attemptAt}"></td>
                        </tr>
                        
                        <!-- 빈 데이터 처리 -->
                        <tr th:if="${#lists.isEmpty(auditLogs)}">
                            <td colspan="7" class="py-5 text-muted bg-light">
                                <i class="bi bi-shield-lock fs-1 d-block mb-3 opacity-50"></i>
                                <span class="fw-bold fs-5 text-dark">아직 수집된 보안 감사 로그가 없습니다.</span>
                                <p class="small mt-2 mb-0">로그인 시도가 발생하면 이곳에 실시간으로 표시됩니다.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>
</html>
