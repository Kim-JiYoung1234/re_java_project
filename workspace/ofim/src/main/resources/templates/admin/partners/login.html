<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 | OFIM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
        .admin-icon { font-size: 3rem; color: #0f172a; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="admin-icon"><i class="bi bi-shield-lock-fill"></i></div>
        <h3 class="fw-bold text-center mb-1">OFIM Admin</h3>
        <p class="text-muted text-center small mb-4">관리자 전용 로그인 페이지입니다.</p>

        <form th:action="@{/admin/login}" method="post">
            <div th:if="${error}" class="alert alert-danger py-2 small text-center" th:text="${error}">에러 메세지</div>

            <div class="mb-3">
                <label class="form-label fw-bold small">아이디</label>
                <input type="text" name="loginId" class="form-control" required placeholder="관리자 아이디">
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold small">비밀번호</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">로그인</button>
        </form>
    </div>

</body>
</html>
