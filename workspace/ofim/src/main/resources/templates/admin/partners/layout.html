<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle} ?: 'OFIM Admin'">OFIM Admin</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    body { background:#f6f7fb; }
    .sidebar { width: 270px; min-height: 100vh; background:#0f172a; color:#fff; }
    .menu a { color:#cbd5e1; text-decoration:none; }
    .menu a.active, .menu a:hover { color:#fff; background: rgba(255,255,255,.08); }
    .topbar { background:#fff; border-bottom:1px solid #e5e7eb; }
    .content-wrap { padding: 24px; }
    .card-soft { border:1px solid #e5e7eb; border-radius: 18px; box-shadow: 0 6px 16px rgba(15,23,42,.04); }
    .muted { color:#94a3b8; }
    .btn-icon { width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; }
  </style>
</head>

<body>
<div class="d-flex">

  <!-- Sidebar -->
  <aside class="sidebar p-3">
    <div class="d-flex align-items-center gap-2 mb-4">
      <div class="btn btn-light btn-icon rounded-4"><i class="bi bi-shield-lock"></i></div>
      <div>
        <div class="fw-bold">OFIM Admin</div>
        <div class="small muted">관리자 콘솔</div>
      </div>
    </div>

    <div class="menu d-grid gap-1">
      <a class="rounded-3 px-3 py-2" th:classappend="${activeMenu}=='dashboard' ? ' active' : ''" th:href="@{/admin}">
        <i class="bi bi-grid me-2"></i> 대시보드
      </a>
      
      <!-- 파트너사 관리 메뉴 추가 -->
      <a class="rounded-3 px-3 py-2" th:classappend="${activeMenu}=='partners' ? ' active' : ''" th:href="@{/admin/partners}">
        <i class="bi bi-building me-2"></i> 파트너사 관리
      </a>

      <a class="rounded-3 px-3 py-2" th:classappend="${activeMenu}=='users' ? ' active' : ''" th:href="@{/admin/users}">
        <i class="bi bi-people me-2"></i> 일반회원 관리
      </a>
      
      <!-- 다른 기존 메뉴들 생략 (필요 시 복구) -->
    </div>

    <hr class="border-secondary my-4"/>

    <div class="small muted">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-person-circle"></i>
        <span th:text="${session.adminUser?.userName} ?: 'Admin'">Admin</span>
      </div>
      <a class="d-inline-block mt-2 text-decoration-underline text-light" th:href="@{/admin/logout}">로그아웃</a>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-grow-1">
    <div class="topbar px-4 py-3 d-flex justify-content-between align-items-center">
      <div>
        <div class="fw-semibold" th:text="${pageTitle} ?: 'Admin'">Admin</div>
        <div class="small text-secondary" th:text="${pageDesc} ?: ''"></div>
      </div>
    </div>

    <div class="content-wrap">
      <div th:switch="${activeMenu}">
        <div th:case="'dashboard'" th:replace="admin/dashboard::content"></div>
        <div th:case="'partners'" th:replace="admin/partners::content"></div>
        <!-- 기타 case들 생략 -->
        <div th:case="*" class="alert alert-warning">페이지를 찾을 수 없습니다.</div>
      </div>
    </div>
  </main>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
