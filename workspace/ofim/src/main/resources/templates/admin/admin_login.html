<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OFIM 관리자 로그인</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
body { background-color: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-box { background: #fff; padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.btn-admin { background-color: #3b82f6; color: white; font-weight: bold; }
.btn-admin:hover { background-color: #2563eb; color: white; }
</style>
</head>
<body>
    <div class="login-box">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3rem;"></i>
            <h4 class="fw-bold mt-2">OFIM Admin System</h4>
            <p class="text-muted small">관리자 권한이 필요합니다.</p>
        </div>

        <form th:action="@{/admin/login}" method="post">
            <div th:if="${error != null}" class="alert alert-danger py-2 small text-center">
                <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
            </div>

            <div class="form-floating mb-3">
                <input type="text" class="form-control bg-light border-0" id="adminId" name="adminId" placeholder="관리자 아이디" required>
                <label for="adminId">관리자 아이디</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control bg-light border-0" id="adminPw" name="adminPw" placeholder="비밀번호" required>
                <label for="adminPw">비밀번호</label>
            </div>
            
            <button type="submit" class="btn btn-admin w-100 py-3 mb-3">관리자 로그인</button>
            <div class="text-center">
                <a th:href="@{/home}" class="text-decoration-none text-muted small">일반 홈으로 돌아가기</a>
            </div>
        </form>
    </div>
</body>
</html>
