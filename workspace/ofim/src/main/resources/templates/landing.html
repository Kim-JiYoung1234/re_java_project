<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - HEALTH-PRO</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 배경 이미지 및 꽉 찬 화면 설정 */
        .bg-image {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                              url('/images/Gemini_Generated_Image_53ikfv53ikfv53ik.png');
                              
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
            /* aspect-ratio: 9 / 16; */
        }

        /* 중앙 문구 스타일 */
        .hero-text {
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            width: 100%;
            padding: 0 20px;
        }

        .hero-text h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .hero-text p {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 40px;
        }

        /* 시작하기 버튼 스타일 */
        .btn-start {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            transition: all 0.3s ease;
            background-color: #0d6efd;
            border: none;
            color: white;
            text-decoration: none;
        }


        .btn-start:hover {
            background-color: #0056b3;
            transform: scale(1.05);
            color: white;
        }

        /* 하단 화살표 애니메이션 */
        .scroll-down {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 2rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0) translateX(-50%);}
            40% {transform: translateY(-10px) translateX(-50%);}
            60% {transform: translateY(-5px) translateX(-50%);}
        }

        @media (max-width: 768px) {
            .hero-text h1 { font-size: 2.5rem; }
            .hero-text p { font-size: 1.1rem; }
        }
		


    </style>
</head>
<body>

<div class="bg-image">
    <div class="hero-text">
        <h1 class="mb-3">OUT FAT IN MUSCLE</h1>
        <p>너의 근육은 배신하지 않아. 끝까지 몰아붙여!</p>
        <p class="small mb-5" style="opacity: 0.8;">식단 관리 | 운동 기록 | 운동 시설 비교 | 전문가 상담</p>
        
        <!-- 2차 홈 화면(index.html)으로 이동하는 버튼 -->
        <a th:href="@{/home}" class="btn-start shadow-lg" id="enterBtn">
            자세히 보기
        </a>
    </div>

    
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
   
</script>

</body>
</html>
